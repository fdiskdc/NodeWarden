name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit hash or tag (leave blank to use latest upstream/main)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git 2>/dev/null ||             git remote set-url upstream https://github.com/shuaiplus/NodeWarden.git
          git fetch upstream main --tags

      - name: Resolve target commit
        id: resolve
        shell: bash
        run: |
          TRIGGER="${{ github.event_name }}"
          MANUAL_INPUT="${{ github.event.inputs.target_commit }}"

          if [ "$TRIGGER" = "schedule" ]; then
            # Scheduled mode: use the latest commit on upstream/main.
            TARGET_SHA=$(git rev-parse upstream/main)

            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            echo "Auto mode — latest upstream/main commit: $TARGET_SHA"

          elif [ -n "$MANUAL_INPUT" ]; then
            # Manual mode: use the provided commit hash or tag.
            TARGET_SHA=$(git rev-parse "$MANUAL_INPUT^{commit}" 2>/dev/null || true)

            if [ -z "$TARGET_SHA" ]; then
              echo "Cannot resolve '$MANUAL_INPUT' to a commit."
              exit 1
            fi

            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            echo "Manual mode — target: $MANUAL_INPUT ($TARGET_SHA)"

          else
            # Manual mode with blank input: use the latest upstream/main commit.
            TARGET_SHA=$(git rev-parse upstream/main)

            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            echo "Manual mode — latest upstream/main commit: $TARGET_SHA"
          fi

      - name: Check if update is needed
        id: check
        shell: bash
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"
          MODE="${{ steps.resolve.outputs.mode }}"

          if [ "$MODE" = "manual" ]; then
            # Manual mode supports both upgrades and rollbacks.
            CURRENT_SHA=$(git rev-parse HEAD)

            if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
              echo "Already at $TARGET_SHA — skipping."
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
            else
              echo "Switching to $TARGET_SHA"
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Scheduled mode skips when the target is already contained in HEAD.
            if git merge-base --is-ancestor "$TARGET_SHA" HEAD 2>/dev/null; then
              echo "Already up to date with $TARGET_SHA — skipping."
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
            else
              echo "Update needed — target: $TARGET_SHA"
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Apply update
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"
          MODE="${{ steps.resolve.outputs.mode }}"

          git checkout main

          if [ "$MODE" = "manual" ]; then
            # Hard reset permits a manually requested upgrade or rollback.
            git reset --hard "$TARGET_SHA"
          else
            # Preserve fork-specific commits while incorporating upstream changes.
            git merge "$TARGET_SHA" --no-edit
          fi

      - name: Restore workflow file
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          # Keep this fork-specific workflow if upstream changes or removes it.
          git checkout HEAD@{1} -- .github/workflows/sync-upstream.yml 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: restore sync-upstream workflow after sync"
          fi

      - name: Push
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          if [ "${{ steps.resolve.outputs.mode }}" = "manual" ]; then
            git push origin main --force
          else
            git push origin main
          fi

      - name: Summary
        shell: bash
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "### Synced successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Mode:** ${{ steps.resolve.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Source:** upstream/main" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Commit:** \`${{ steps.resolve.outputs.target_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Nothing to update" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Source:** upstream/main" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Commit:** \`${{ steps.resolve.outputs.target_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
